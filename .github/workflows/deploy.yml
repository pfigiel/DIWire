name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
# Deploys finish in the order they were merged; a cancelled one could leave the project half-updated.
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  SUPABASE_PROJECT_ID: jyxqaaeaqxwtiagvaord
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build --filter=@diwire/backend
      # The CLI asks before it changes a hosted project, and a runner has no terminal to answer on.
      - run: pnpm --filter @diwire/backend functions:deploy --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run:
          curl --fail --silent --show-error --retry 5 --retry-all-errors
          "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/api/health"
  web:
    name: web
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_QmMXbVuHx3ZEy3zdCvElCW2a
      VERCEL_PROJECT_ID: prj_1Qq3qj4cUf645LC4prkC6QVwXn8x
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Run from the registry at a pinned version: as a dependency the CLI brings advisories into
      # the audit that nothing we ship contains.
      - run: pnpm dlx vercel@65.16.0 pull --yes --environment=production
      - run: pnpm dlx vercel@65.16.0 build --prod
      - run: pnpm dlx vercel@65.16.0 deploy --prebuilt --prod
