#:schema https://supabase.com/schemas/config/v1.json
# Only what differs from the defaults is declared: `supabase config push` writes every declared
# property to the hosted project on each deploy and leaves the rest of the project alone.
project_id = "diwire"

[auth]
site_url = "https://diwire.vercel.app"
additional_redirect_urls = ["http://localhost:5173"]

# Google is the only way in.
[auth.email]
enabled = false

[auth.external.google]
enabled = true
client_id = "264926277135-e4nnkn0topb9n5h0bjvkstqpfqd9m4ls.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

# The Hono app answers `/health` to anyone and verifies a user's token itself, so the gateway's own
# check, which would turn away every request without a key, stays off.
[functions.api]
verify_jwt = false
